# Builds FreedomSheets for macOS on Apple Silicon and uploads a zipped .app as a workflow
# artifact (no release, no tag). The app is ad-hoc signed, not notarized: on first start,
# right-click > Open (or `xattr -dr com.apple.quarantine FreedomSheets.app`).
name: macOS Sheets build

on:
  push:
    branches: [orgs]
    paths: ["sheets/**", "cosync/**", "Cargo.toml", "Cargo.lock", ".github/workflows/macos-sheets.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-aarch64-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked -p freedom-sheets

      - name: Test (Sheets)
        run: cargo test --release --locked -p freedom-sheets

      - name: Package .app
        run: |
          set -eu
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="freedom-sheets"))')
          APP=dist/FreedomSheets.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/FreedomSheets "$APP/Contents/MacOS/FreedomSheets"
          # CFBundleURLTypes registers freedomoffice:// ("Open in Sheets" links). macOS hands the
          # link to a running app as an Apple Event (kAEGetURL), not in argv, and winit 0.30 has
          # no public event for it, so for now clicking a link only starts the app; the link
          # opens when given as an argument: open -a FreedomSheets --args 'freedomoffice://open?...'
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>FreedomSheets</string>
            <key>CFBundleDisplayName</key><string>FreedomOffice Sheets</string>
            <key>CFBundleIdentifier</key><string>com.freedomoffice.sheets</string>
            <key>CFBundleExecutable</key><string>FreedomSheets</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Spreadsheet</string>
                <key>CFBundleTypeRole</key><string>Editor</string>
                <key>CFBundleTypeExtensions</key><array><string>xlsx</string><string>csv</string></array>
              </dict>
            </array>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>com.freedomoffice.sheets.open</string>
                <key>CFBundleURLSchemes</key><array><string>freedomoffice</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          file "$APP/Contents/MacOS/FreedomSheets"
          (cd dist && ditto -c -k --keepParent FreedomSheets.app FreedomSheets-macos-aarch64.app.zip)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: FreedomSheets-macos-aarch64.app.zip
          path: dist/FreedomSheets-macos-aarch64.app.zip
          if-no-files-found: error
          retention-days: 30
