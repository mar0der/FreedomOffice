[workspace]
resolver = "3"
members = ["sheets", "server", "cosync", "drive"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Password hashing is deliberately slow; keep it optimized in test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
