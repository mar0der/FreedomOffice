[package]
name = "freedom-sheets"
version = "26.45.2"
edition = "2024"
rust-version = "1.88"
description = "FreedomOffice Sheets - a lightweight, open source spreadsheet application"
license = "MIT"
repository = "https://github.com/mar0der/FreedomOffice"

[[bin]]
name = "FreedomSheets"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
calamine = "0.38"
rust_xlsxwriter = "0.102"
rfd = "0.17"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
serde_json = "1"
regex-lite = "0.1.9"
serde = { version = "1", features = ["derive", "rc"] }
cosync = { path = "../cosync" }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security_Cryptography", "Win32_Storage_Xps", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[dev-dependencies]
# End-to-end tests of the server client against a real server on 127.0.0.1 (tests only).
freedomoffice-server = { path = "../server" }

[build-dependencies]
embed-resource = "3"
