[package]
name = "freedomoffice-sheetview"
version = "26.45.2"
edition = "2024"
description = "FreedomOffice web Sheets: turns a workbook (file version plus the live log) into the JSON the browser viewer draws"
license = "MIT"
repository = "https://github.com/mar0der/FreedomOffice"

[lib]
name = "sheetview"
path = "src/lib.rs"

[dependencies]
cosync = { path = "../cosync" }
freedom-sheets = { path = "../sheets", default-features = false }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.102"
