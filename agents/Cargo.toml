[package]
name = "freedomsheets-agents"
version = "26.45.2"
edition = "2024"
description = "fsheets: a headless live client for FreedomOffice documents (agents, scripted tests)"
license = "MIT"
repository = "https://github.com/mar0der/FreedomOffice"

[lib]
name = "fsheets"
path = "src/lib.rs"

[[bin]]
name = "fsheets"
path = "src/main.rs"

[dependencies]
cosync = { path = "../cosync" }
serde_json = "1"
freedom-sheets = { path = "../sheets", default-features = false }
rust_xlsxwriter = "0.102"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }
getrandom = "0.3"

[dev-dependencies]
freedomoffice-server = { path = "../server" }
