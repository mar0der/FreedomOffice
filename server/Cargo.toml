[package]
name = "freedomoffice-server"
version = "26.45.2"
edition = "2024"
description = "FreedomOffice document server - self-hosted file storage, sharing and version history for FreedomOffice Sheets"
license = "MIT"
repository = "https://github.com/mar0der/FreedomOffice"

[lib]
name = "freedomoffice_server"
path = "src/lib.rs"

[[bin]]
name = "freedomoffice-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "ws"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rpassword = "7"
cosync = { path = "../cosync" }

[dev-dependencies]
ureq = { version = "3", default-features = false }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
